name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mobile/package-lock.json
      - run: npm ci
      - run: npm ci --prefix mobile
      - run: npm test
      - run: npm run native:test
      - run: npm run native:parity
      - run: make -C native sanitize
      - run: npx tsc --noEmit --incremental false
      - run: npm run typecheck --prefix mobile
      - run: npm run lint
      - run: npm run build
